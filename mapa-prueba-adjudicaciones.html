<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de prueba — adjudicaciones Novaedat</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #172033; background: #f4f7fb; }
    header { padding: 22px 28px; background: #112d4e; color: #fff; }
    h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 6px 0 0; opacity: .82; }
    #map { height: calc(100vh - 112px); min-height: 520px; }
    .key { position: fixed; z-index: 1000; right: 18px; bottom: 24px; padding: 14px 16px; background: #fff; border-radius: 10px; box-shadow: 0 3px 18px #0002; font-size: .9rem; }
    .key div { margin-top: 7px; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 7px; }
    .open { background: #137a4b; }.pending { background: #db8b00; }.review { background: #536a88; }
    .popup h2 { margin: 0 0 6px; font-size: 1rem; }.popup p { margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Adjudicaciones — mapa de prueba</h1>
    <p>Ejemplo para comprobar la publicación con GitHub Pages.</p>
  </header>
  <main id="map" aria-label="Mapa de adjudicaciones de prueba"></main>
  <aside class="key" aria-label="Leyenda">
    <strong>Estado</strong>
    <div><span class="dot open"></span>Contrato firmado</div>
    <div><span class="dot pending"></span>Adjudicado / pendiente</div>
    <div><span class="dot review"></span>En revisión</div>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([39.48, -0.45], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const lotes = [
      { nombre: 'Hospital General — Valencia', coords: [39.475, -0.398], estado: 'Contrato firmado', tipo: 'Menores' },
      { nombre: 'Sagunto', coords: [39.683, -0.277], estado: 'Contrato firmado', tipo: 'Menores' },
      { nombre: 'Castellón', coords: [39.986, -0.037], estado: 'Contrato firmado', tipo: 'Menores' },
      { nombre: 'Alicante – San Juan', coords: [38.401, -0.437], estado: 'Contrato firmado', tipo: 'Menores' },
      { nombre: 'Dénia', coords: [38.841, 0.106], estado: 'Contrato firmado', tipo: 'Menores' },
      { nombre: 'Gandía', coords: [38.970, -0.185], estado: 'Adjudicado / pendiente', tipo: 'Adultos' },
      { nombre: 'Elche', coords: [38.266, -0.699], estado: 'Adjudicado / pendiente', tipo: 'Adultos' },
      { nombre: 'Xàtiva', coords: [38.990, -0.519], estado: 'En revisión', tipo: 'Adultos' }
    ];
    const colores = { 'Contrato firmado': '#137a4b', 'Adjudicado / pendiente': '#db8b00', 'En revisión': '#536a88' };
    lotes.forEach(lote => {
      L.circleMarker(lote.coords, { radius: 10, color: '#fff', weight: 2, fillColor: colores[lote.estado], fillOpacity: 1 })
        .bindPopup(`<div class="popup"><h2>${lote.nombre}</h2><p><b>Área:</b> ${lote.tipo}</p><p><b>Estado:</b> ${lote.estado}</p></div>`)
        .addTo(map);
    });
  </script>
</body>
</html>
